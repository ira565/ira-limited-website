name: Final shop photo update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-shop:
    if: ${{ !contains(github.event.head_commit.message, '[final-shop-photo-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final shop layout and real product photography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text()

          replacements = {
            # Category order
            '<option value="vegetables">Vegetables</option><option value="baking">Home Baking</option>': '<option value="baking">Home Baking</option><option value="vegetables">Vegetables</option><option value="breakfast">Breakfast Club</option>',
            '<select id="filter" class="filter" onchange="render()">': '<select id="filter" class="filter" onchange="filterChange()">',

            # Real product photography already stored in this repository
            "product-images/premium-peanut-oil.svg": "peanut%20oil.jpeg",
            "product-images/premium-organic-peanut-oil.svg": "peanut%20oil.jpeg",
            "product-images/premium-forest-honey.svg": "forest-honey.jpg",
            "product-images/premium-ajwain-honey.svg": "ajwain-honey.jpg",
            "product-images/premium-multi-flower-honey.svg": "multi-flower-honey.jpg",
            "product-images/premium-honey-mix.svg": "honey-mix.jpg",
            "product-images/premium-cow-ghee.svg": "ghee.jpeg",
            "product-images/premium-coconut-oil.svg": "cocnut%20oil.jpeg",
            "product-images/premium-flaxseed-oil.svg": "flaxseed-oil.jpg",
            "product-images/premium-eggs.svg": "egg.jpeg",
            "product-images/premium-multigrain-cookies.svg": "multigrain-cookies.jpg",
            "product-images/premium-protein-bites.svg": "choco-dipped-protein-bites.jpg",
            "product-images/premium-seed-trail-mix.svg": "seed-trail-mix.jpg",
            "product-images/premium-brownies.svg": "brownies.jpeg",
            "product-images/premium-protein-brownies.svg": "protein-brownies.jpg",
            "product-images/premium-protein-cheesecake.svg": "protein-cheesecake.jpg",
            "product-images/premium-tiramisu.svg": "tiramisu.jpg",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Keep Breakfast Club as a filter that opens the membership section.
          marker = "const products=["
          if 'function filterChange()' not in s:
              s = s.replace(marker, "function filterChange(){const f=document.getElementById('filter').value;if(f==='breakfast'){document.getElementById('membership').scrollIntoView({behavior:'smooth'});return}render()}" + marker)

          # Make photographic cards look clean and consistent.
          s = s.replace('object-fit:contain;object-position:center;padding:10px;image-rendering:auto;background:linear-gradient(180deg,#f4eddf,#eee6d5)', 'object-fit:cover;object-position:center;image-rendering:auto')
          p.write_text(s)
          PY
      - name: Commit final shop update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply final shop photography and category order [final-shop-photo-update]"
          git push
