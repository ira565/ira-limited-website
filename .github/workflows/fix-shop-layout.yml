name: Fix shop card layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix product cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.product{background:var(--ivory);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s;position:relative}':
              '.product{background:var(--ivory);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s;position:relative;display:flex;flex-direction:column;min-width:0}',
              '.product-img{height:210px;background:linear-gradient(145deg,#e4e8df,#eee4cf);display:grid;place-items:center;position:relative}':
              '.product-img{height:240px;min-height:240px;overflow:hidden;background:linear-gradient(145deg,#e4e8df,#eee4cf);display:grid;place-items:center;position:relative;flex:0 0 240px}',
              '.product-img img{width:100%;height:100%;object-fit:cover}':
              '.product-img img{width:100%;height:100%;max-width:100%;display:block;object-fit:cover;object-position:center}',
              '.product-info{padding:19px}':
              '.product-info{padding:19px;position:relative;z-index:2;background:var(--ivory)}',
              '.add{width:100%;border:0;background:var(--forest);color:#fff;padding:12px;border-radius:999px;font-weight:800}':
              '.add{width:100%;border:0;background:var(--forest);color:#fff;padding:13px;border-radius:999px;font-weight:800;position:relative;z-index:3;pointer-events:auto;transition:.2s}.add:hover{background:var(--forest2);transform:translateY(-1px)}'
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          p.write_text(s, encoding='utf-8')
          if not changed:
              print('No CSS replacements needed; layout may already be fixed.')

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html
          rm -f .github/workflows/fix-shop-layout.yml
          git add .github/workflows/fix-shop-layout.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix product card layout and ordering buttons"
          git push
